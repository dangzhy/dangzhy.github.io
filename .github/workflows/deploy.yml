name: Build and deploy homepage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Read Pages URL
        id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - name: Build selected website content
        run: npm run build
        env:
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
      - run: npm run check:site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy selected content
        id: deployment
        uses: actions/deploy-pages@v5
